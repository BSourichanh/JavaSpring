game.taquin.default-board-size=4

game.connectfour.default-player-count=2
game.connectfour.default-board-size=7

# Clé secrète partagée pour validation JWT locale (Itération 5)
jwt.secret=${JWT_SECRET:MaSuperCleSecreteDe256BitsPourSignerMesTokensEnTouteSecurite!}